
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Ofertas y servicios</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #f5f7fb;
      min-height: 100vh;
    }

    .navbar-brand {
      font-weight: 700;
    }

    .hero {
      background: linear-gradient(135deg, #17366b, #3867b5);
      color: white;
      padding: 3rem 0;
    }

    .offer-card {
      height: 100%;
      border: none;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease;
    }

    .offer-card:hover {
      transform: translateY(-4px);
    }

    .offer-image {
      width: 100%;
      height: 220px;
      object-fit: contain;
      padding: 12px;
      background-color: white;
    }

    .offer-price {
      color: #244a8f;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .user-name {
      color: #fff;
      font-size: 0.9rem;
      overflow-wrap: anywhere;
    }

    footer {
      color: #667085;
    }
  </style>
</head>

<body>

  <!-- Navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

      <a class="navbar-brand" href="./">
        Servicios
      </a>

      <div class="d-flex align-items-center gap-2 ms-auto flex-wrap">

        <span
          id="userName"
          class="user-name d-none"
          aria-live="polite"
        ></span>

        <button
          id="signInButton"
          class="btn btn-outline-light btn-sm"
          type="button"
        >
          Iniciar sesión con Google
        </button>

        <button
          id="signOutButton"
          class="btn btn-warning btn-sm d-none"
          type="button"
        >
          Cerrar sesión
        </button>

      </div>
    </div>
  </nav>

  <!-- Encabezado -->
  <header class="hero">
    <div class="container">
      <h1 class="display-5 fw-bold">Ofertas</h1>
      <p class="lead mb-0">
        Conocé nuestros servicios y las ofertas disponibles.
      </p>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="container py-5">

    <section aria-labelledby="offersHeading">

      <div class="mb-4">
        <h2 id="offersHeading" class="h3">
          Ofertas disponibles
        </h2>

        <p class="text-secondary">
          Iniciá sesión para consultar las ofertas vigentes.
        </p>
      </div>

      <!-- Estado de la aplicación -->
      <div
        id="status"
        class="alert alert-info"
        role="status"
        aria-live="polite"
      >
        Iniciá sesión con Google para cargar las ofertas.
      </div>

      <!-- Tarjetas de ofertas -->
      <div
        id="offersGrid"
        class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
      ></div>

    </section>

  </main>

  <footer class="container py-4 text-center small">
    Información de ofertas y servicios.
  </footer>

  <!-- Firebase SDK modular, sin herramientas de compilación -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


    // =====================================================
    // 1. CONFIGURACIÓN DE FIREBASE
    // =====================================================

    const firebaseConfig = {
      apiKey: "AIzaSyCtxAZwG9rxY7Gya518ahYSUH_LorOnNPw",
      authDomain: "pentihum-digital.firebaseapp.com",
      projectId: "pentihum-digital",
      storageBucket: "pentihum-digital.firebasestorage.app",
      messagingSenderId: "692387438680",
      appId: "1:692387438680:web:de661bf6635b861ccf6a2d"
    };


    // =====================================================
    // 2. URL DEL SERVICIO GOOGLE APPS SCRIPT
    // =====================================================

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzHqqcXAur_4YaAxdQoG461_7fl7-u1Kid2eI9hSfB71a3FA2ZV8uXSn9QMveNZMSaOmA/exec";


    // =====================================================
    // 3. INICIALIZACIÓN DE FIREBASE AUTHENTICATION
    // =====================================================

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const googleProvider = new GoogleAuthProvider();

    // Solicita elegir una cuenta de Google cada vez
    // que se inicia un nuevo proceso de inicio de sesión.
    googleProvider.setCustomParameters({
      prompt: "select_account"
    });


    // =====================================================
    // 4. ELEMENTOS DEL DOCUMENTO
    // =====================================================

    const signInButton =
      document.getElementById("signInButton");

    const signOutButton =
      document.getElementById("signOutButton");

    const userName =
      document.getElementById("userName");

    const statusBox =
      document.getElementById("status");

    const offersGrid =
      document.getElementById("offersGrid");


    // Identifica cada solicitud para impedir que una
    // respuesta anterior restaure ofertas tras cerrar sesión.
    let requestGeneration = 0;


    // =====================================================
    // 5. FUNCIONES DE INTERFAZ
    // =====================================================

    function setStatus(message, type = "info") {
      statusBox.className = `alert alert-${type}`;
      statusBox.textContent = message;
      statusBox.classList.remove("d-none");
    }


    function clearOffers() {
      offersGrid.replaceChildren();
    }


    function showSignedOutState() {
      requestGeneration++;

      clearOffers();

      userName.textContent = "";
      userName.classList.add("d-none");

      signOutButton.classList.add("d-none");

      signInButton.classList.remove("d-none");
      signInButton.disabled = false;

      setStatus(
        "Iniciá sesión con Google para consultar las ofertas.",
        "info"
      );
    }


    // =====================================================
    // 6. CREACIÓN DE TARJETAS
    // =====================================================

    function displayOffers(offers) {
      clearOffers();

      if (offers.length === 0) {
        setStatus(
          "En este momento no hay ofertas disponibles.",
          "secondary"
        );
        return;
      }

      const fragment = document.createDocumentFragment();

      for (const offer of offers) {

        // Los nombres de las propiedades deben coincidir
        // exactamente con la respuesta real de Apps Script.
        const requiredFields = [
          "Nombre",
          "Precio",
          "Descripcion",
          "Imagen"
        ];

        const validOffer =
          offer !== null &&
          typeof offer === "object" &&
          !Array.isArray(offer) &&
          requiredFields.every(field =>
            Object.prototype.hasOwnProperty.call(offer, field) &&
            offer[field] !== null &&
            offer[field] !== undefined &&
            String(offer[field]).trim() !== ""
          );

        // No mostrar tarjetas incompletas ni valores undefined.
        if (!validOffer) {
          clearOffers();

          setStatus(
            "La respuesta del servicio contiene una oferta " +
            "incompleta. Se esperaban los campos Nombre, Precio, " +
            "Descripcion e Imagen. No se mostraron las tarjetas.",
            "danger"
          );

          return;
        }

        const column = document.createElement("div");
        column.className = "col";

        const card = document.createElement("article");
        card.className = "card offer-card";

        // Imagen del producto o servicio.
        const image = document.createElement("img");

        image.className = "offer-image";
        image.alt = `Imagen de ${String(offer.Nombre)}`;
        image.loading = "lazy";

        // La ruta se interpreta respecto de index.html.
        // Ejemplo:
        // multimedia/imagenesproductos/producto1.jpg
        image.src = String(offer.Imagen).trim();

        image.addEventListener("error", () => {
          image.alt = "No se pudo cargar la imagen.";
          image.classList.add("d-none");
        }, { once: true });

        // Contenido de la tarjeta.
        const body = document.createElement("div");

        body.className =
          "card-body d-flex flex-column";

        const title = document.createElement("h3");

        title.className = "card-title h5";
        title.textContent = String(offer.Nombre);

        const price = document.createElement("p");

        price.className = "offer-price mb-2";
        price.textContent = String(offer.Precio);

        const description = document.createElement("p");

        description.className =
          "card-text text-secondary mb-0";

        description.textContent =
          String(offer.Descripcion);

        body.append(title, price, description);

        card.append(image, body);
        column.append(card);

        fragment.append(column);
      }

      offersGrid.append(fragment);

      setStatus(
        `Se cargaron ${offers.length} ` +
        `${offers.length === 1 ? "oferta" : "ofertas"} correctamente.`,
        "success"
      );
    }


    // =====================================================
    // 7. CONSULTA DE OFERTAS A APPS SCRIPT
    // =====================================================

    async function loadOffers(user) {
      const generation = ++requestGeneration;

      clearOffers();

      setStatus("Cargando ofertas…", "info");

      try {

        // Obtener el ID token del usuario autenticado.
        const idToken = await user.getIdToken();

        // Cancelar lógicamente si la sesión cambió.
        if (
          generation !== requestGeneration ||
          !auth.currentUser ||
          auth.currentUser.uid !== user.uid
        ) {
          return;
        }

        // El servicio existente recibe el token por GET:
        // doGet(e) -> e.parameter.token
        const url = new URL(APPS_SCRIPT_URL);

        url.searchParams.set("token", idToken);

        const response = await fetch(url.toString(), {
          method: "GET",
          headers: {
            "Accept": "application/json"
          },
          redirect: "follow",
          cache: "no-store"
        });

        const responseText = await response.text();

        if (
          generation !== requestGeneration ||
          !auth.currentUser ||
          auth.currentUser.uid !== user.uid
        ) {
          return;
        }

        let data;

        try {
          data = JSON.parse(responseText);
        } catch {
          throw new Error(
            "El servicio no devolvió JSON válido. " +
            "Verificá la URL de implementación y la respuesta de Apps Script."
          );
        }

        // Apps Script devuelve objetos { error: "..." }
        // cuando falla la validación o la lectura de la hoja.
        if (
          data !== null &&
          typeof data === "object" &&
          !Array.isArray(data) &&
          data.error
        ) {
          throw new Error(String(data.error));
        }

        // La respuesta correcta debe ser un array JSON.
        if (!Array.isArray(data)) {
          throw new Error(
            "Formato de respuesta inesperado. " +
            "Se esperaba un array JSON de ofertas."
          );
        }

        displayOffers(data);

      } catch (error) {

        if (
          generation !== requestGeneration ||
          !auth.currentUser ||
          auth.currentUser.uid !== user.uid
        ) {
          return;
        }

        clearOffers();

        let message;

        if (error instanceof TypeError) {
          message =
            "No se pudo leer la respuesta de Google Apps Script. " +
            "Verificá la conexión, las redirecciones y la consola " +
            "del navegador para determinar si existe una restricción " +
            "de comunicación entre dominios.";
        } else {
          message = error?.message ||
            "Ocurrió un error inesperado.";
        }

        setStatus(
          `No se pudieron cargar las ofertas. ${message}`,
          "danger"
        );

        console.error(
          "Error al cargar las ofertas:",
          error
        );
      }
    }


    // =====================================================
    // 8. INICIAR SESIÓN CON GOOGLE
    // =====================================================

    signInButton.addEventListener("click", async () => {
      signInButton.disabled = true;

      try {

        await signInWithPopup(auth, googleProvider);

        // onAuthStateChanged se encargará de actualizar
        // la interfaz y solicitar las ofertas.

      } catch (error) {

        let message;

        if (error?.code === "auth/popup-closed-by-user") {
          message =
            "Se cerró la ventana antes de completar el inicio de sesión.";

        } else if (error?.code === "auth/unauthorized-domain") {
          message =
            "El dominio de GitHub Pages no está autorizado en Firebase. " +
            "Agregalo en Authentication, Configuración y Dominios autorizados.";

        } else {
          message =
            error?.message ||
            "No se pudo iniciar sesión con Google.";
        }

        setStatus(message, "danger");

        console.error(
          "Error de inicio de sesión:",
          error
        );

      } finally {

        if (!auth.currentUser) {
          signInButton.disabled = false;
        }
      }
    });


    // =====================================================
    // 9. CERRAR SESIÓN
    // =====================================================

    signOutButton.addEventListener("click", async () => {

      // Eliminar las ofertas inmediatamente, antes de
      // esperar la finalización del cierre de sesión.
      requestGeneration++;

      clearOffers();

      setStatus("Cerrando sesión…", "info");

      signOutButton.disabled = true;

      try {

        await signOut(auth);

        // onAuthStateChanged actualizará el resto de la interfaz.

      } catch (error) {

        setStatus(
          "No se pudo cerrar la sesión: " +
          (error?.message || "error desconocido"),
          "danger"
        );

        console.error(
          "Error al cerrar sesión:",
          error
        );

      } finally {

        signOutButton.disabled = false;
      }
    });


    // =====================================================
    // 10. DETECTAR EL ESTADO DE AUTENTICACIÓN
    // =====================================================

    onAuthStateChanged(auth, user => {

      if (user) {

        // Usuario autenticado.
        userName.textContent =
          user.displayName ||
          user.email ||
          "Usuario autenticado";

        userName.classList.remove("d-none");

        signInButton.classList.add("d-none");

        signOutButton.classList.remove("d-none");
        signOutButton.disabled = false;

        // Consultar las ofertas solamente con sesión válida.
        loadOffers(user);

      } else {

        // Visitante: ofertas eliminadas y acceso disponible.
        showSignedOutState();
      }
    });

  </script>

</body>
</html>
